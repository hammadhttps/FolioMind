# Blueprint Section 14 so far: verify, local service checks, migrations with
# integration tests, and image builds. Later phases add end-to-end and
# deployment jobs; Phase 10 pins actions to commit SHAs.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    # No keys in CI; `next typegen` (typecheck) and `next build` both load env.ts.
    env:
      SKIP_ENV_VALIDATION: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:route-trace

  services:
    name: Local service smoke checks
    runs-on: ubuntu-latest
    # Keyless subset of `pnpm check:services` against the Compose stack (Phase 2).
    env:
      DIRECT_DATABASE_URL: postgres://foliomind:foliomind@localhost:5433/foliomind
      UPSTASH_REDIS_REST_URL: http://localhost:8079
      UPSTASH_REDIS_REST_TOKEN: foliomind-local-dev-token
      BROWSERLESS_WS_ENDPOINT: ws://localhost:3001
      BROWSERLESS_TOKEN: foliomind-local-dev-token
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start Postgres, Redis, Upstash proxy and Browserless
        run: docker compose -f infra/compose.yaml up -d --wait postgres redis upstash-http browserless
      - run: pnpm check:services --only=postgres,upstash,browserless
      - name: Service logs
        if: failure()
        run: docker compose -f infra/compose.yaml logs --tail=100
      - name: Stop the stack
        if: always()
        run: docker compose -f infra/compose.yaml down -v

  integration:
    name: Migrations and integration tests
    runs-on: ubuntu-latest
    # Disposable pgvector Postgres plus the Upstash-compatible proxy (Section 14).
    env:
      DIRECT_DATABASE_URL: postgres://foliomind:foliomind@localhost:5433/foliomind
      TEST_DATABASE_URL: postgres://foliomind:foliomind@localhost:5433/foliomind_test
      TEST_UPSTASH_REDIS_REST_URL: http://localhost:8079
      TEST_UPSTASH_REDIS_REST_TOKEN: foliomind-local-dev-token
      DATABASE_RUNTIME_PASSWORD: ci-runtime-password
      REQUIRE_TEST_SERVICES: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start Postgres, Redis and the Upstash proxy
        run: docker compose -f infra/compose.yaml up -d --wait postgres redis upstash-http
      - name: Apply the committed migrations to an empty database
        run: pnpm db:migrate
      - run: pnpm db:roles
      - run: pnpm db:seed
      - name: Schema and migrations agree
        run: |
          pnpm db:generate --name drift_check
          if [ -n "$(git status --porcelain packages/db/migrations)" ]; then
            echo "::error::The Drizzle schema has changes with no migration. Run pnpm db:generate and commit the reviewed SQL."
            git status --porcelain packages/db/migrations
            exit 1
          fi
      - name: Domain integration tests (Postgres and Redis)
        run: pnpm --filter @foliomind/domain test
      - name: Workflow integration tests (ingestion and import on Postgres)
        run: pnpm --filter @foliomind/workflows test
      - name: Chat integration tests (retrieval, access and quotas on Postgres)
        run: pnpm --filter @foliomind/ai test
      - name: Rate-limit tests (Upstash proxy)
        run: pnpm --filter web exec vitest run lib/rate-limit
      - name: Service logs
        if: failure()
        run: docker compose -f infra/compose.yaml logs --tail=100
      - name: Stop the stack
        if: always()
        run: docker compose -f infra/compose.yaml down -v

  docker:
    name: Build ${{ matrix.image }} image
    runs-on: ubuntu-latest
    # A stuck step fails here instead of running to GitHub's 6-hour limit.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: [web, ingestion, generation, migrate]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.${{ matrix.image }}
          push: false
          load: ${{ matrix.image == 'ingestion' }}
          tags: foliomind-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      # The bundle must start in the production image and stop cleanly on
      # SIGTERM. Placeholder values only: the worker boots, then retries Inngest.
      - name: Worker A boots from its image and stops on SIGTERM
        if: matrix.image == 'ingestion'
        run: |
          docker run -d --name worker-a \
            -e APP_ENV=production \
            -e DIRECT_DATABASE_URL=postgres://ci:ci@db.invalid/ci \
            -e UPSTASH_REDIS_REST_URL=https://redis.invalid \
            -e UPSTASH_REDIS_REST_TOKEN=ci \
            -e BROWSERLESS_WS_ENDPOINT=wss://browserless.invalid \
            -e BROWSERLESS_TOKEN=ci \
            -e INNGEST_EVENT_KEY=ci \
            -e INNGEST_SIGNING_KEY=signkey-prod-ci \
            -e UPLOADTHING_TOKEN=ci \
            -e JINA_API_KEY=ci \
            foliomind-ingestion:ci
          timeout 60 sh -c 'until docker logs worker-a 2>&1 | grep -q "\"worker booted\""; do sleep 1; done' \
            || { docker logs worker-a; exit 1; }
          docker stop --time 10 worker-a
          docker logs worker-a
          test "$(docker inspect worker-a --format '{{.State.ExitCode}}')" = "0"
